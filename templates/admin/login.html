<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login | OKWebStudio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
</head>
<body class="admin-body">

<div class="login-shell">

    <div class="login-card">

        <div class="login-logo">OK<span>WebStudio</span></div>
        <div class="login-subtitle">ADMIN DASHBOARD</div>

        {% if using_default_credentials %}
        <div class="login-default-warning">
            ⚠️ You're using the built-in default login. Set <strong>ADMIN_USERNAME</strong>
            and <strong>ADMIN_PASSWORD</strong> in your <code>.env</code> file before this
            site goes live.
        </div>
        {% endif %}

        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}

        <form method="POST" class="login-form">

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="admin-input" type="text" id="username" name="username"
                       autocomplete="username" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="admin-input" type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="login-submit">Log In</button>

        </form>

        <a href="{{ url_for('home') }}" class="login-back">← Back to okwebstudio.com</a>

    </div>

</div>

</body>
</html>
