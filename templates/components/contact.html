<section class="contact reveal" id="contact">

    <div class="container">

        <div class="contact-box">

            <div class="contact-left">

                <span class="eyebrow">Let's Talk</span>

                <h2>
                    Ready To Build Your
                    Business Website?
                </h2>

                <p>
                    Whether you need a business website, school portal, e-commerce store,
                    or custom web application, we're ready to bring your ideas to life.
                </p>

            </div>

            <div class="contact-right">

                <div id="successMessage"
                     class="success-message"
                     style="display: none;">
                </div>

                <form id="contactForm" action="/contact" method="POST">

                    <input
                        type="text"
                        name="name"
                        placeholder="Your Name"
                        required>

                    <input
                        type="email"
                        name="email"
                        placeholder="Email Address"
                        required
                        autocomplete="email">

                    <input
                        type="text"
                        name="project"
                        placeholder="Project Type"
                        required>

                    <textarea
                        name="message"
                        placeholder="Tell us about your project"
                        required></textarea>

                    <button type="submit" id="submitBtn">
                        🚀 Send Project Request
                    </button>

                </form>

            </div>

        </div>

    </div>

</section>
